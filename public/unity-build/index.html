<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | FeedbackLabsVR</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">FeedbackLabsVR</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/unity-build.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/unity-build.data.unityweb",
        frameworkUrl: buildUrl + "/unity-build.framework.js.unityweb",
        codeUrl: buildUrl + "/unity-build.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "FeedbackLabs",
        productName: "FeedbackLabsVR",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };

          // ============================================================
          // React <-> Unity bridge (postMessage over the iframe boundary)
          //
          // Keep this in sync with, on the React side:
          //   FeedbackLabWeb/src/types/unity.types.ts   (UnityToReactEvent / UnityCommand)
          //   FeedbackLabWeb/src/hooks/useUnityBridge.ts (listens for {type,...}, sends {command,payload})
          // and on the Unity side:
          //   Assets/_FeedbackLabsVR/Scripts/Bridge/WebGLBridge.cs
          //   Assets/_FeedbackLabsVR/Plugins/WebGL/WebGLBridge.jslib
          //
          // Exposing unityInstance on window is the officially documented way
          // to call SendMessage() from browser script after load (Unity Manual:
          // "WebGL: Interact with browser scripting") — there is no other public
          // handle to it once createUnityInstance()'s promise resolves.
          // ============================================================
          window.unityInstance = unityInstance;

          // React -> Unity: relay {command, payload} messages from the parent
          // page into the WebGLBridge GameObject. That GameObject MUST be
          // named exactly "WebGLBridge" in the scene for SendMessage to find it.
          window.addEventListener("message", function (event) {
            if (event.source !== window.parent) return;
            var msg = event.data;
            if (!msg || typeof msg !== "object" || typeof msg.command !== "string") return;
            try {
              unityInstance.SendMessage("WebGLBridge", msg.command, JSON.stringify(msg.payload || {}));
            } catch (e) {
              console.error("[FeedbackLabsVR] Failed to relay command to Unity:", msg.command, e);
            }
          });
        }).catch((message) => {
          unityShowBanner(message, 'error');
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
