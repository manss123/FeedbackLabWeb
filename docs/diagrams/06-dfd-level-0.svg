<text x="55" y="1150" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526875" text-anchor="start">No data stores are shown at context level. Service errors are valid outputs, not fabricated success.</text>
<text x="55" y="1175" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526875" text-anchor="start">Speech recognition is browser-dependent. TTS is the implemented callable contract; its Unity caller is not verified here.</text>
<text x="55" y="1285" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526875" text-anchor="start">Notation: blue = external entity; green = numbered process; amber/double line = data store.</text>
<text x="55" y="1310" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526875" text-anchor="start">Named arrows are data flows. Repeated entity/store identifiers refer to the same logical endpoint.</text>
<text x="55" y="1352" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#526875" text-anchor="start">FeedbackLab  |  Source-based model  |  17 September 2026</text>
