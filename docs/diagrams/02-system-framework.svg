<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990" role="img" aria-labelledby="title desc"><title id="title">02  System Framework</title><desc id="desc">Intended learning sequence with implemented research observation; prerequisites are not all server-enforced.</desc><rect width="100%" height="100%" fill="white"/>
